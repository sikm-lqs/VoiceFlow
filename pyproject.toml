[project]
name = "voice-input"
version = "1.0.0"
description = "本地语音输入助手（Ubuntu + vLLM ASR）"
requires-python = ">=3.10"
dependencies = [
    "python-xlib>=0.33",
    "sounddevice==0.5.1",
    "numpy==2.2.6",
    "requests==2.32.3",
    "pyyaml==6.0.2",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "requests-mock>=1.12",
    "scipy>=1.14",
]

[tool.setuptools]
py-modules = [
    "audio_recorder",
    "asr_client",
    "window_detector",
    "utils",
    "text_cleanup",
    "minimax_cleanup",
    "runtime_status",
    "voiceflow_session",
    "install_lifecycle",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
